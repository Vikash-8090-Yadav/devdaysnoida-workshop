<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101610">
    <title>Snake — Arcade</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101610;
        color: #f1f5ec;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #929d8d;
        --green: #b5f36a;
        --panel: #171f17;
        --line: #293329;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(ellipse at 50% 35%, #273424 0, transparent 52%),
          #101610;
      }

      button { font: inherit; }

      .game {
        width: min(100%, 510px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #ffff00;
        font-size: clamp(38px, 8vw, 54px);
        line-height: 1;
        letter-spacing: -.07em;
      }

      .intro {
        margin: 12px 0 24px;
        color: var(--muted);
        font-size: 14px;
      }

      .score-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .score-card {
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #161d16;
      }

      .score-label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      .score-value {
        font-size: 22px;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
      }

      .board-wrap {
        position: relative;
        overflow: hidden;
        border: 1px solid #394536;
        border-radius: 16px;
        background: #111811;
        box-shadow: 0 24px 70px #0008, inset 0 0 40px #0005;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        touch-action: none;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b100bbd;
        text-align: center;
        backdrop-filter: blur(3px);
        transition: opacity .16s ease;
      }

      .overlay[hidden] { display: none; }
      .overlay-content { max-width: 270px; }

      .overlay h2 {
        margin: 0 0 8px;
        font-size: 26px;
        letter-spacing: -.04em;
      }

      .overlay p {
        margin: 0;
        color: #b0b9aa;
        font-size: 13px;
        line-height: 1.6;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
      }

      .button-group { display: flex; gap: 8px; }

      .action {
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid #3a4935;
        border-radius: 10px;
        background: #1a2419;
        color: #e7efdf;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background .15s ease, transform .15s ease;
      }

      .action:hover { background: #253322; }
      .action:active { transform: translateY(1px); }
      .action:focus-visible, .direction:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }

      .action.primary {
        border-color: var(--green);
        background: var(--green);
        color: #172012;
      }

      .action.primary:hover { background: #c9ff82; }

      .hint {
        color: var(--muted);
        font-size: 11px;
        text-align: right;
      }

      .mobile-controls {
        display: none;
        grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(2, 42px);
        justify-content: center;
        gap: 5px;
        margin: 16px auto 0;
      }

      .direction {
        display: grid;
        place-items: center;
        border: 1px solid #3a4935;
        border-radius: 9px;
        background: var(--panel);
        color: #e7efdf;
        font-size: 17px;
        cursor: pointer;
        touch-action: manipulation;
      }

      .direction[data-dir="up"] { grid-column: 2; grid-row: 1; }
      .direction[data-dir="left"] { grid-column: 1; grid-row: 2; }
      .direction[data-dir="down"] { grid-column: 2; grid-row: 2; }
      .direction[data-dir="right"] { grid-column: 3; grid-row: 2; }

      @media (pointer: coarse), (max-width: 560px) {
        .mobile-controls { display: grid; }
        .hint { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <p class="eyebrow">Pocket arcade · 01</p>
      <h1>Snake.</h1>
      <p class="intro">Eat, grow, and don't run into yourself.</p>

      <section class="score-row" aria-label="Game scores">
        <div class="score-card">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">00</span>
        </div>
        <div class="score-card">
          <span class="score-label">Best</span>
          <span class="score-value" id="best">00</span>
        </div>
      </section>

      <div class="board-wrap">
        <canvas id="board" width="440" height="440" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-content">
            <h2 id="overlay-title">Ready to play?</h2>
            <p id="overlay-message">Use the arrow keys or WASD to move. Press Space to pause.</p>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="button-group">
          <button class="action primary" id="start-button" type="button">Start game</button>
          <button class="action" id="restart-button" type="button">Restart</button>
        </div>
        <span class="hint">ARROW KEYS / WASD <span aria-hidden="true">·</span> SPACE TO PAUSE</span>
      </div>

      <div class="mobile-controls" aria-label="Touch movement controls">
        <button class="direction" type="button" data-dir="up" aria-label="Move up">↑</button>
        <button class="direction" type="button" data-dir="left" aria-label="Move left">←</button>
        <button class="direction" type="button" data-dir="down" aria-label="Move down">↓</button>
        <button class="direction" type="button" data-dir="right" aria-label="Move right">→</button>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("#board");
      const ctx = canvas.getContext("2d");
      const scoreDisplay = document.querySelector("#score");
      const bestDisplay = document.querySelector("#best");
      const overlay = document.querySelector("#overlay");
      const overlayTitle = document.querySelector("#overlay-title");
      const overlayMessage = document.querySelector("#overlay-message");
      const startButton = document.querySelector("#start-button");
      const cells = 20;
      const cellSize = canvas.width / cells;

      let snake;
      let food;
      let direction;
      let nextDirection;
      let score = 0;
      let best = Number(localStorage.getItem("snake-best") || 0);
      let timer = null;
      let state = "ready";

      bestDisplay.textContent = String(best).padStart(2, "0");

      function reset() {
        snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
        direction = { x: 1, y: 0 };
        nextDirection = direction;
        score = 0;
        scoreDisplay.textContent = "00";
        food = placeFood();
        draw();
      }

      function placeFood() {
        const emptyCells = [];
        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            if (!snake.some(segment => segment.x === x && segment.y === y)) {
              emptyCells.push({ x, y });
            }
          }
        }
        return emptyCells.length
          ? emptyCells[Math.floor(Math.random() * emptyCells.length)]
          : null;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#263126";
        ctx.lineWidth = 1;
        for (let i = 1; i < cells; i++) {
          const point = i * cellSize;
          ctx.beginPath();
          ctx.moveTo(point, 0);
          ctx.lineTo(point, canvas.height);
          ctx.moveTo(0, point);
          ctx.lineTo(canvas.width, point);
          ctx.stroke();
        }

        if (food) {
          ctx.fillStyle = "#ff8067";
          ctx.shadowColor = "#ff8067";
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.arc(
            (food.x + .5) * cellSize,
            (food.y + .5) * cellSize,
            cellSize * .3,
            0,
            Math.PI * 2
          );
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        snake.forEach((segment, index) => {
          const inset = index === 0 ? 2 : 3;
          ctx.fillStyle = index === 0 ? "#d2ff9b" : "#91d84d";
          ctx.beginPath();
          ctx.roundRect(
            segment.x * cellSize + inset,
            segment.y * cellSize + inset,
            cellSize - inset * 2,
            cellSize - inset * 2,
            5
          );
          ctx.fill();
        });

        const head = snake[0];
        ctx.fillStyle = "#314624";
        const eyeX = head.x * cellSize + cellSize / 2 + direction.x * 3;
        const eyeY = head.y * cellSize + cellSize / 2 + direction.y * 3;
        ctx.beginPath();
        ctx.arc(eyeX - direction.y * 4, eyeY + direction.x * 4, 1.5, 0, Math.PI * 2);
        ctx.arc(eyeX + direction.y * 4, eyeY - direction.x * 4, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      function showOverlay(title, message) {
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        overlay.hidden = false;
      }

      function hideOverlay() {
        overlay.hidden = true;
      }

      function start() {
        if (state === "running") return;
        if (state === "gameover") reset();
        state = "running";
        startButton.textContent = "Pause";
        hideOverlay();
        clearInterval(timer);
        timer = setInterval(tick, Math.max(65, 125 - Math.floor(score / 50) * 5));
      }

      function pause() {
        if (state !== "running") return;
        clearInterval(timer);
        timer = null;
        state = "paused";
        startButton.textContent = "Resume";
        showOverlay("Paused", "Take a breather. Press Space or Resume when you're ready.");
      }

      function endGame() {
        clearInterval(timer);
        timer = null;
        state = "gameover";
        startButton.textContent = "Play again";
        showOverlay("Game over", `You scored ${score}. Press Enter or Play again to try once more.`);
      }

      function tick() {
        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };
        const eating = head.x === food.x && head.y === food.y;
        const bodyToCheck = eating ? snake : snake.slice(0, -1);

        if (
          head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells ||
          bodyToCheck.some(segment => segment.x === head.x && segment.y === head.y)
        ) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 10;
          scoreDisplay.textContent = String(score).padStart(2, "0");
          if (score > best) {
            best = score;
            bestDisplay.textContent = String(best).padStart(2, "0");
            localStorage.setItem("snake-best", String(best));
          }
          food = placeFood();
          if (!food) {
            clearInterval(timer);
            timer = null;
            state = "gameover";
            startButton.textContent = "Play again";
            draw();
            showOverlay("Board cleared!", `Perfect run! You scored ${score}. Press Enter or Play again to go again.`);
            return;
          }
          clearInterval(timer);
          timer = setInterval(tick, Math.max(65, 125 - Math.floor(score / 50) * 5));
        } else {
          snake.pop();
        }
        draw();
      }

      function changeDirection(name) {
        const directions = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        const candidate = directions[name];
        if (!candidate || candidate.x === -nextDirection.x && candidate.y === -nextDirection.y) return;
        nextDirection = candidate;
        if (state === "ready") start();
      }

      document.addEventListener("keydown", event => {
        const keys = {
          ArrowUp: "up", w: "up", W: "up",
          ArrowDown: "down", s: "down", S: "down",
          ArrowLeft: "left", a: "left", A: "left",
          ArrowRight: "right", d: "right", D: "right"
        };
        if (keys[event.key]) {
          event.preventDefault();
          changeDirection(keys[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          state === "running" ? pause() : start();
        } else if (event.key === "Enter") {
          start();
        }
      });

      document.querySelectorAll(".direction").forEach(button => {
        button.addEventListener("click", () => changeDirection(button.dataset.dir));
      });

      startButton.addEventListener("click", () => {
        state === "running" ? pause() : start();
      });

      document.querySelector("#restart-button").addEventListener("click", () => {
        clearInterval(timer);
        reset();
        state = "ready";
        startButton.textContent = "Start game";
        showOverlay("Ready to play?", "Use the arrow keys or WASD to move. Press Space to pause.");
      });

      reset();
    </script>
  </body>
</html>
